name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      # GPG_KEY is an organization secret mapped to this repository. It holds the
      # ASCII-armored private key whose public half is registered with the Terraform
      # Registry; the registry verifies the signature on every release, so a key
      # mismatch shows up as a release that is never ingested rather than as a failure
      # here. The key carries no passphrase, so no passphrase input is supplied --
      # setting an empty one makes gpg prompt and the step hangs to its timeout.
      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_KEY }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GoReleaser signs the checksum file with this key; its public half must be registered
          # in the Terraform Registry namespace settings or the release will not be ingested.
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
